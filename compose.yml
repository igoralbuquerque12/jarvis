services:
  migrate:
    build:
      context: ./server
      target: builder
    env_file:
      - ./server/.env
    command: npx prisma migrate deploy
    networks:
      - jarvis-internal
    restart: "no"

  server:
    container_name: jarvis-server
    build:
      context: ./server
      target: production
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - jarvis-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - jarvis-internal

networks:
  jarvis-internal:
    name: jarvis-internal

volumes:
  redis-data:

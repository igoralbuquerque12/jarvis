x-securo-env: &securo-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@securo-db:5432/securo
  SECRET_KEY: ${SECURO_SECRET_KEY:-dev-secret-change-in-production}
  DEBUG: "false"
  FRONTEND_URL: http://localhost:8000
  REDIS_URL: redis://redis:6379/1
  STORAGE_LOCAL_PATH: /app/data/attachments

services:
  migrate:
    build:
      context: ./server
      target: builder
    env_file:
      - ./server/.env
    command: npx prisma migrate deploy
    networks:
      - jarvis-internal
    restart: "no"

  server:
    container_name: jarvis-server
    build:
      context: ./server
      target: production
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      securo-backend:
        condition: service_started
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      REDIS_URL: redis://redis:6379
      SECURO_API_URL: http://securo-backend:8000
      WEB_ORIGIN: https://${FRONTEND_DOMAIN}
      BETTER_AUTH_URL: https://${API_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.jarvis-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.jarvis-api.entrypoints=websecure
      - traefik.http.routers.jarvis-api.tls=true
      - traefik.http.routers.jarvis-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.jarvis-api.loadbalancer.server.port=3000
    networks:
      - jarvis-internal
      - proxy

  web:
    container_name: jarvis-web
    build:
      context: ./web
      target: production
      args:
        VITE_API_URL: https://${API_DOMAIN}
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
    restart: unless-stopped
    depends_on:
      - server
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.jarvis-web.rule=Host(`${FRONTEND_DOMAIN}`)
      - traefik.http.routers.jarvis-web.entrypoints=websecure
      - traefik.http.routers.jarvis-web.tls=true
      - traefik.http.routers.jarvis-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.jarvis-web.loadbalancer.server.port=80
    networks:
      - jarvis-internal
      - proxy

  securo-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securo
    volumes:
      - securo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis-internal

  securo-migrate:
    build: ./securo/backend
    environment: *securo-env
    command: alembic upgrade head
    depends_on:
      securo-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jarvis-internal
    restart: "no"

  securo-backend:
    container_name: jarvis-securo
    build: ./securo/backend
    restart: unless-stopped
    environment: *securo-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - securo-attachments:/app/data/attachments
    depends_on:
      securo-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - jarvis-internal

  securo-celery-worker:
    build: ./securo/backend
    restart: unless-stopped
    environment: *securo-env
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    volumes:
      - securo-attachments:/app/data/attachments
    depends_on:
      securo-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - jarvis-internal

  securo-celery-beat:
    build: ./securo/backend
    restart: unless-stopped
    environment: *securo-env
    command: celery -A app.worker beat --loglevel=info
    depends_on:
      securo-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - jarvis-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - jarvis-internal

networks:
  jarvis-internal:
    name: jarvis-internal
  proxy:
    external: true
    name: proxy

volumes:
  redis-data:
  securo-pgdata:
  securo-attachments:
